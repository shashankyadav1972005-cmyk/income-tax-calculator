<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Income Tax Calculator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#2193b0,#6dd5ed);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container{
    width:380px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#333;
}

label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

.result{
    margin-top:20px;
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    font-size:18px;
}

.result p{
    margin:8px 0;
}
</style>

</head>
<body>

<div class="container">

<h2>Income Tax Calculator</h2>

<label>Annual Income (₹)</label>
<input type="number" id="income" placeholder="Enter Annual Income">

<label>Select Tax Percentage</label>
<select id="taxRate">
<option value="5">5%</option>
<option value="10">10%</option>
<option value="15">15%</option>
<option value="20">20%</option>
<option value="30">30%</option>
<option value="custom">Custom %</option>
</select>

<label>Custom Percentage</label>
<input type="number" id="customRate" placeholder="Enter Custom %" disabled>

<button onclick="calculateTax()">Calculate</button>

<div class="result">

<p><b>Income :</b> ₹<span id="incomeResult">0</span></p>

<p><b>Tax Percentage :</b> <span id="rateResult">0</span>%</p>

<p><b>Tax Amount :</b> ₹<span id="taxResult">0</span></p>

<p><b>Net Income :</b> ₹<span id="netIncome">0</span></p>

</div>

</div>

<script>

let taxSelect=document.getElementById("taxRate");
let custom=document.getElementById("customRate");

taxSelect.addEventListener("change",function(){

if(this.value=="custom"){
custom.disabled=false;
}else{
custom.disabled=true;
custom.value="";
}

});

function calculateTax(){

let income=parseFloat(document.getElementById("income").value);

if(isNaN(income)||income<0){
alert("Please Enter Valid Income");
return;
}

let rate;

if(taxSelect.value=="custom"){
rate=parseFloat(custom.value);

if(isNaN(rate)||rate<0){
alert("Enter Valid Percentage");
return;
}

}else{
rate=parseFloat(taxSelect.value);
}

let tax=(income*rate)/100;

let net=income-tax;

document.getElementById("incomeResult").innerHTML=income.toFixed(2);

document.getElementById("rateResult").innerHTML=rate;

document.getElementById("taxResult").innerHTML=tax.toFixed(2);

document.getElementById("netIncome").innerHTML=net.toFixed(2);

}

</script>

</body>
</html>
